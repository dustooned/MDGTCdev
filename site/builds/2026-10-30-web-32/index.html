<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Mr. Duck / City Day</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<style>body{background:#183d43}#canvas{outline:none}#md-note{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;max-width:min(560px,92vw);background:#fff4dc;color:#25464b;border:3px solid #25464b;border-radius:12px;padding:12px 14px;font:15px/1.35 system-ui,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.35)}#md-note b{display:block;margin-bottom:4px}#md-note button,#md-note a{margin:8px 8px 0 0;font:inherit;padding:6px 10px;border-radius:8px;border:2px solid #25464b;background:#fff;color:#25464b;text-decoration:none;display:inline-block}</style>
<script>
/* Crash notes for playtests. iPad Safari kills a tab that runs out of memory and reloads it,
   which looks like "the game reset". This records what it can (errors, a lost GPU context,
   a session that ended without the page closing normally) and, on the next load, offers the
   details to copy into a bug report. Nothing leaves the device unless the player sends it. */
(function(){
  var LOG="mrduck-crash-log",RUN="mrduck-running";
  function read(){try{return JSON.parse(localStorage.getItem(LOG)||"[]")}catch(e){return []}}
  function pads(){try{return Array.prototype.filter.call(navigator.getGamepads?navigator.getGamepads():[],function(p){return p}).map(function(p){return p.id+" ("+(p.mapping||"no mapping")+", "+p.buttons.length+" buttons)"})}catch(x){return []}}
  function device(){return {ua:navigator.userAgent,dpr:window.devicePixelRatio,screen:screen.width+"x"+screen.height,view:innerWidth+"x"+innerHeight,touch:navigator.maxTouchPoints||0,memory:navigator.deviceMemory||null,heap:(performance.memory&&performance.memory.usedJSHeapSize)||null,gamepads:pads()}}
  function log(kind,detail){try{var l=read();var e=device();e.t=new Date().toISOString();e.kind=kind;e.detail=String(detail||"").slice(0,300);e.seen=false;l.push(e);localStorage.setItem(LOG,JSON.stringify(l.slice(-12)))}catch(x){}}
  try{
    var prev=localStorage.getItem(RUN);
    if(prev){var p=JSON.parse(prev);log("unclean-exit","the last session ended without closing (started "+p.start+", last alive "+p.alive+")")}
    var run={start:new Date().toISOString(),alive:new Date().toISOString()};
    localStorage.setItem(RUN,JSON.stringify(run));
    setInterval(function(){try{run.alive=new Date().toISOString();localStorage.setItem(RUN,JSON.stringify(run))}catch(x){}},5000);
    window.addEventListener("pagehide",function(e){if(!e.persisted){try{localStorage.removeItem(RUN)}catch(x){}}});
  }catch(x){}
  window.addEventListener("error",function(e){log("error",(e.message||"")+" @ "+(e.filename||"")+":"+(e.lineno||""))});
  window.addEventListener("unhandledrejection",function(e){log("rejection",e.reason&&(e.reason.message||e.reason))});
  document.addEventListener("webglcontextlost",function(){log("webgl-context-lost","the graphics context was lost (often memory pressure)")},true);
  /* Keyboard focus for iPad Safari (and any browser): keys reach the game only while its
     canvas has focus, and a tap on a button or the page, switching apps or this note can
     take it away. Hand it back on any tap or click, when the tab returns, and when a key
     arrives while focus is elsewhere. Text fields keep their focus. */
  function canvas(){return document.getElementById("canvas")||document.querySelector("canvas")}
  function refocus(){var c=canvas();var a=document.activeElement;if(!c||a===c)return;if(a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA"||a.isContentEditable))return;if(!c.hasAttribute("tabindex"))c.setAttribute("tabindex","0");try{c.focus({preventScroll:true})}catch(x){c.focus()}}
  ["pointerdown","touchend","mousedown"].forEach(function(t){document.addEventListener(t,function(e){if(!(e.target&&e.target.closest&&e.target.closest("#md-note")))setTimeout(refocus,0)},true)});
  window.addEventListener("focus",refocus);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)setTimeout(refocus,50)});
  window.addEventListener("keydown",function(e){var c=canvas();if(c&&document.activeElement!==c&&!(e.target&&(e.target.tagName=="INPUT"||e.target.tagName=="TEXTAREA")))refocus()},true);
  window.addEventListener("gamepadconnected",function(e){log("gamepad-connected",e.gamepad.id+" ("+(e.gamepad.mapping||"no mapping")+")");var l=read();if(l.length){l[l.length-1].seen=true;try{localStorage.setItem(LOG,JSON.stringify(l))}catch(x){}}});
  window.addEventListener("DOMContentLoaded",function(){
    var l=read(),fresh=l.filter(function(e){return !e.seen});
    if(!fresh.length)return;
    var last=fresh[fresh.length-1];
    var box=document.createElement("div");box.id="md-note";
    var what=last.kind=="unclean-exit"?"The game stopped unexpectedly last time":(last.kind=="webgl-context-lost"?"The graphics stopped last time":"Something went wrong last time");
    box.innerHTML="<b>"+what+".</b>Your progress up to the last save is kept. If you have a moment, copy the details into a bug report: it helps a lot.<br>";
    var text=JSON.stringify(fresh,null,1);
    var copy=document.createElement("button");copy.textContent="Copy details";copy.onclick=function(){try{navigator.clipboard.writeText(text);copy.textContent="Copied"}catch(x){window.prompt("Copy these details:",text)}};
    var report=document.createElement("a");report.textContent="Report a bug";report.target="_blank";report.rel="noopener";report.href="https://github.com/dustooned/MDGTCdev/issues/new?template=bug-report.yml";
    var close=document.createElement("button");close.textContent="Close";close.onclick=function(){box.remove()};
    box.appendChild(copy);box.appendChild(report);box.appendChild(close);document.body.appendChild(box);
    l.forEach(function(e){e.seen=true});try{localStorage.setItem(LOG,JSON.stringify(l))}catch(x){}
    setTimeout(function(){if(box.parentNode)box.style.opacity=".85"},12000);
  });
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":25279456,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
